# ═══════════════════════════════════════════════════════
# CanaryGuard — Docker Compose (Local Services)
# ═══════════════════════════════════════════════════════

services:
  # ─── Local PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: deploymind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deploymind
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Background Queues - Milestone M6) ────────
  redis:
    image: redis:7-alpine
    container_name: canaryguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
